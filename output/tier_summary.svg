<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title description">
  <title id="title">Tiered human-mouse variant correspondence</title>
  <desc id="description">Independent evidence tier row counts and positive-control recovery matrix.</desc>
  <style>
    .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324D; }
    .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526779; }
    .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243746; }
    .count { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17324D; }
    .matrixHead { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324D; text-anchor: middle; }
    .cell { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526779; }
  </style>
  <rect width="1100" height="680" fill="#FFFFFF"/>
  <text x="54" y="56" class="title">Tiered human-mouse variant correspondence</text>
  <text x="54" y="87" class="subtitle">Independent connection bases, separate DB tables; bars use log10(row count + 1)</text>
  <text x="54" y="145" class="label">tier1: Monarch phenotype bridge</text>
      <rect x="54" y="155" width="700" height="25" rx="5" fill="#E8EFF4"/>
      <rect x="54" y="155" width="700.0" height="25" rx="5" fill="#315C83"/>
      <text x="774" y="174" class="count">1,089,740</text>
<text x="54" y="223" class="label">tier2: Ortholog-first phenotype evidence</text>
      <rect x="54" y="233" width="700" height="25" rx="5" fill="#E8EFF4"/>
      <rect x="54" y="233" width="566.3" height="25" rx="5" fill="#168273"/>
      <text x="774" y="252" class="count">76,619</text>
<text x="54" y="301" class="label">tier3: Curated disease model</text>
      <rect x="54" y="311" width="700" height="25" rx="5" fill="#E8EFF4"/>
      <rect x="54" y="311" width="640.0" height="25" rx="5" fill="#A26A24"/>
      <text x="774" y="330" class="count">331,245</text>
  <line x1="54" y1="408" x2="1046" y2="408" stroke="#D7E0E7"/>
  <text x="54" y="442" class="label">Positive-control recovery</text>
  <text x="620" y="442" class="matrixHead">tier1</text>
<text x="770" y="442" class="matrixHead">tier2</text>
<text x="920" y="442" class="matrixHead">tier3</text>
  <text x="54" y="475" class="label">TLR4_LPS_001</text><rect x="570" y="452" width="118" height="36" rx="7" fill="#EFF3F6"/>
        <text x="629" y="475" text-anchor="middle" class="cell" fill="#526779">-</text>
<rect x="720" y="452" width="118" height="36" rx="7" fill="#EFF3F6"/>
        <text x="779" y="475" text-anchor="middle" class="cell" fill="#526779">-</text>
<rect x="870" y="452" width="118" height="36" rx="7" fill="#EFF3F6"/>
        <text x="929" y="475" text-anchor="middle" class="cell" fill="#526779">-</text>
<text x="54" y="527" class="label">CFTR_F508DEL_001</text><rect x="570" y="504" width="118" height="36" rx="7" fill="#D8F0E6"/>
        <text x="629" y="527" text-anchor="middle" class="cell" fill="#116B4D">6 rows</text>
<rect x="720" y="504" width="118" height="36" rx="7" fill="#EFF3F6"/>
        <text x="779" y="527" text-anchor="middle" class="cell" fill="#526779">-</text>
<rect x="870" y="504" width="118" height="36" rx="7" fill="#D8F0E6"/>
        <text x="929" y="527" text-anchor="middle" class="cell" fill="#116B4D">2 rows</text>
<text x="54" y="579" class="label">ALPL_HPP_001</text><rect x="570" y="556" width="118" height="36" rx="7" fill="#EFF3F6"/>
        <text x="629" y="579" text-anchor="middle" class="cell" fill="#526779">-</text>
<rect x="720" y="556" width="118" height="36" rx="7" fill="#D8F0E6"/>
        <text x="779" y="579" text-anchor="middle" class="cell" fill="#116B4D">20 rows</text>
