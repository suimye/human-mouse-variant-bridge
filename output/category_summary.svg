<rect x="775" y="462" width="110" height="36" rx="7" fill="#EFF3F6"/>
        <text x="830" y="485" text-anchor="middle" class="cell" fill="#526779">-</text>
<rect x="910" y="462" width="110" height="36" rx="7" fill="#D8F0E6"/>
        <text x="965" y="485" text-anchor="middle" class="cell" fill="#116B4D">2 rows</text>
<text x="54" y="537" class="label">ALPL_HPP_001</text><rect x="505" y="514" width="110" height="36" rx="7" fill="#EFF3F6"/>
        <text x="560" y="537" text-anchor="middle" class="cell" fill="#526779">-</text>
